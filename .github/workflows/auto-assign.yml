name: Auto-assign issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  assign:
    if: ${{ toJSON(github.event.issue.assignees) == '[]' }}
    runs-on: ubuntu-latest
    steps:
      - run: gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-assignee fernandofilter
        env:
          GH_TOKEN: ${{ github.token }}
