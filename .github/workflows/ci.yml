name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen && npx tsc --noEmit
      - run: npm test
      - name: Migrations em dia com o schema
        run: |
          npm run db:generate
          git add -A drizzle
          git diff --cached --exit-code --stat drizzle || (echo "::error::Schema mudou sem migration. Rode npm run db:generate e commite." && exit 1)
